<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="860" height="150" viewBox="0 0 860 150" fill="none" role="img" aria-label="分流规则库">
  <style>
    text { font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
           "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; }
    .title { font-size:31px; font-weight:700; fill:#111418; letter-spacing:-0.5px; }
    .sub { font-size:14.5px; fill:#6b7280; }
    .stat { font-size:13px; fill:#6b7280; }
    .statv { font-weight:600; fill:#111418; }
    .chip { fill:#f7f8fa; stroke:#e6e9ee; }
    .chiptxt { font-size:13.5px; font-weight:500; fill:#111418; }
    .rule { stroke:#eceef1; }
    @media (prefers-color-scheme: dark) {
      .title { fill:#eef1f5; }
      .sub { fill:#8b939f; }
      .stat { fill:#8b939f; }
      .statv { fill:#eef1f5; }
      .chip { fill:#14171b; stroke:#262b33; }
      .chiptxt { fill:#eef1f5; }
      .rule { stroke:#1d2127; }
    }
  </style>
  <g transform="translate(0, 22)">
<g><rect class="chip" x="660" y="0" width="92" height="42" rx="21"/><image x="667" y="8" width="26" height="26" xlink:href="data:image/jpeg;base64,"/><text class="chiptxt" x="701" y="27">Loon</text></g><g><rect class="chip" x="760" y="0" width="100" height="42" rx="21"/><image x="767" y="8" width="26" height="26" xlink:href="data:image/jpeg;base64,"/><text class="chiptxt" x="801" y="27">Egern</text></g>
  </g>
  <text class="title" x="0" y="66">分流规则库</text>
  <text class="sub" x="0" y="94">选择规则组，一键导入 Loon / Egern</text>
  <line class="rule" x1="0" y1="118" x2="860" y2="118"/>
  <text class="stat" x="0" y="140">
    <tspan class="statv">27</tspan> 组规则
    <tspan> · </tspan>
    <tspan class="statv">440,744</tspan> 条
  </text>
</svg>
