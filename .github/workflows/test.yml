name: Sync Qure Icons & Generate Custom JSON

on:
  schedule:
    - cron: '0 9 * * 0'   # 每周日 UTC 9:00 跑一次（够用，图标更新极慢）
  workflow_dispatch:       # 允许手动触发

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Create icons directory
        run: mkdir -p icons

      - name: Download all PNG icons from Koolson/Qure IconSet
        run: |
          # 先获取 IconSet 目录的文件列表（用 GitHub API 或简单方式）
          curl -s https://api.github.com/repos/Koolson/Qure/contents/IconSet \
            | jq -r '.[].name' > icon_names.txt

          # 下载每个 PNG
          while IFS= read -r icon_name; do
            if [[ "$icon_name" == *.png ]]; then
              curl -L -o "icons/$icon_name" \
                "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/$icon_name"
              echo "Downloaded: $icon_name"
            fi
          done < icon_names.txt

      - name: Generate your own custom JSON (QureColor-My.json)
        run: |
          # 生成一个简单的 JSON，全部用你仓库的 raw 链接
          # 假设你的仓库叫 yourusername/your-repo，分支 main
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="main"  # 或 master，根据你的默认分支改

          echo '{' > my-icons.json
          echo '  "icons": [' >> my-icons.json

          first=true
          for file in icons/*.png; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .png)
              url="https://raw.githubusercontent.com/$REPO_OWNER/$REPO_NAME/$BRANCH/icons/$filename.png"
              
              if [ "$first" = true ]; then
                first=false
              else
                echo '    ,' >> my-icons.json
              fi
              
              echo "    {\"name\": \"$filename\", \"img-url\": \"$url\"}" >> my-icons.json
            fi
          done

          echo '  ]' >> my-icons.json
          echo '}' >> my-icons.json

          # 美化一下（可选，用 jq）
          jq . my-icons.json > QureColor-My.json && rm my-icons.json || cp my-icons.json QureColor-My.json

      - name: Commit changes if any
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          git add icons/ QureColor-My.json || true
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync Qure icons & generate custom JSON (auto)"
            git push
          fi

      - name: Cleanup temp files
        run: rm -f icon_names.txt