name: Readme

on:
  workflow_dispatch:
    inputs:
      generate_html:
        description: "同时生成响应式 index.html"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 1 * * *"
  push:
    paths:
      - "Loon/Rules/**"
      - "Egern/Rules/**"
      - ".github/workflows/Readme.yml"

permissions:
  contents: write

concurrency:
  group: readme-generator
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README
        env:
          GENERATE_HTML: ${{ inputs.generate_html || 'true' }}
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import base64
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          REPO = os.environ.get("GITHUB_REPOSITORY", "fieldw18/test")
          BRANCH = os.environ.get("GITHUB_REF_NAME", "main")
          RAW = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH
          WITH_HTML = os.environ.get("GENERATE_HTML", "true").lower() == "true"

          LOON_DIR = Path("Loon/Rules")
          EGERN_DIR = Path("Egern/Rules")
          ASSET_DIR = Path("assets")
          BANNER = ASSET_DIR / "header.svg"

          # 标题（想改名只改这两行）
          TITLE = "分流规则库"
          SUBTITLE = "选择规则组，一键导入 Loon / Egern"

          # 分组规则：按用途归类，未列出的规则自动落到「其他」
          SECTIONS = [
              ("常用服务", ["AI", "Apple", "AppleCN", "Github", "Google", "Meta", "Telegram", "Twitter", "Talkatone"]),
              ("流媒体", ["Netflix", "PikPak", "Spotify", "YouTube"]),
              ("国内应用", ["Alibaba", "ByteDance", "China", "ChinaIPs", "DouYin", "GeoipCN", "Tencent", "TikTok"]),
              ("网络工具", ["Global", "HttpDns", "Lan", "SpeedtestChina", "SpeedtestInternational"]),
              ("广告拦截", ["BanAD"]),
          ]
          OTHER_TITLE = "其他"

          def http_get(url, timeout=20):
              request = urllib.request.Request(url, headers={"User-Agent": "readme-generator/3.0"})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read()

          # ------------------------------------------------------------ 导入目标 App
          def app_info(app_id):
              """返回 (图标URL, 图标字节)。任一失败则相应为空。"""
              try:
                  payload = json.loads(http_get(
                      "https://itunes.apple.com/lookup?id=" + app_id + "&country=us").decode("utf-8", "replace"))
                  for result in payload.get("results") or []:
                      icon_url = result.get("artworkUrl100") or result.get("artworkUrl512")
                      if not icon_url:
                          continue
                      try:
                          return icon_url, http_get(icon_url)
                      except Exception as exc:
                          print("图标下载失败 " + app_id + "：" + str(exc))
                          return icon_url, b""
              except Exception as exc:
                  print("App 查询失败 " + app_id + "：" + str(exc))
              return "", b""

          APPS = [
              {"name": "Loon", "key": "loon", "url": "1373567447"},
              {"name": "Egern", "key": "egern", "url": "1616105820"},
          ]
          for app in APPS:
              app["icon"], app["bytes"] = app_info(app["url"])
              app["mime"] = "image/jpeg" if app["icon"].lower().endswith((".jpg", ".jpeg")) else "image/png"
              print("App " + app["name"] + "：" + ("ok" if app["icon"] else "缺失"))

          # ------------------------------------------------------------ 规则信息
          def parse_count(path):
              try:
                  with path.open(encoding="utf-8", errors="replace") as handle:
                      for _ in range(6):
                          line = next(handle, "")
                          if not line:
                              break
                          found = re.match(r"#\s*规则统计:\s*(\d+)", line)
                          if found:
                              return int(found.group(1))
              except OSError:
                  pass
              return 0

          def loon_link(url):
              return "https://www.nsloon.com/openloon/import?rules=" + urllib.parse.quote(url, safe="")

          def egern_link(url):
              return ("https://egernapp.com/rules/new?type=rule_set&match="
                      + urllib.parse.quote(url, safe="") + "&policy=DIRECT")

          groups = []
          seen = set()
          for path in sorted(LOON_DIR.glob("*.list")):
              egern_path = EGERN_DIR / (path.stem + ".yaml")
              groups.append({
                  "name": path.stem,
                  "count": parse_count(path),
                  "loon_url": RAW + "/Loon/Rules/" + path.name,
                  "egern_url": (RAW + "/Egern/Rules/" + egern_path.name) if egern_path.exists() else "",
              })
              seen.add(path.stem)

          for path in sorted(EGERN_DIR.glob("*.yaml")):
              if path.stem in seen:
                  continue
              groups.append({
                  "name": path.stem,
                  "count": parse_count(path),
                  "loon_url": "",
                  "egern_url": RAW + "/Egern/Rules/" + path.name,
              })

          if not groups:
              raise SystemExit("未找到规则文件，请先运行 Build workflow")

          total_rules = sum(item["count"] for item in groups)

          # 归组
          buckets = []
          for title, names in SECTIONS:
              items = [g for g in groups if g["name"] in names]
              if items:
                  buckets.append((title, items))
          rest = [g for g in groups if not any(g["name"] in names for _, names in SECTIONS)]
          if rest:
              buckets.append((OTHER_TITLE, rest))
          print("共 " + str(len(groups)) + " 组 / " + f"{total_rules:,}" + " 条，分 " + str(len(buckets)) + " 个板块")

          def button_md(app, url):
              if app["icon"]:
                  label = '<img src="' + app["icon"] + '" width="14" height="14" alt=""> ' + app["name"]
              else:
                  label = app["name"]
              return "[" + label + "](" + url + ")"

          def buttons_md(item):
              out = []
              if item["loon_url"]:
                  out.append(button_md(APPS[0], loon_link(item["loon_url"])))
              if item["egern_url"]:
                  out.append(button_md(APPS[1], egern_link(item["egern_url"])))
              return " · ".join(out) if out else "—"

          # ------------------------------------------------------------ assets/header.svg
          def chip(x, width, app):
              label_x = x + (41 if app["bytes"] else 15)
              image = ""
              if app["bytes"]:
                  encoded = base64.b64encode(app["bytes"]).decode("ascii")
                  image = ('<image x="' + str(x + 7) + '" y="8" width="26" height="26" '
                           'xlink:href="data:' + app["mime"] + ";base64," + encoded + '"/>')
              return (
                  "<g>"
                  '<rect class="chip" x="' + str(x) + '" y="0" width="' + str(width) + '" height="42" rx="21"/>'
                  + image
                  + '<text class="chiptxt" x="' + str(label_x) + '" y="27">' + app["name"] + "</text>"
                  "</g>"
              )

          chips_x = 860 - (92 + 8 + 100)
          svg = """<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
            width="860" height="150" viewBox="0 0 860 150" fill="none" role="img" aria-label="__TITLE__">
            <style>
              text { font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                     "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; }
              .title { font-size:31px; font-weight:700; fill:#111418; letter-spacing:-0.5px; }
              .sub { font-size:14.5px; fill:#6b7280; }
              .stat { font-size:13px; fill:#6b7280; }
              .statv { font-weight:600; fill:#111418; }
              .chip { fill:#f7f8fa; stroke:#e6e9ee; }
              .chiptxt { font-size:13.5px; font-weight:500; fill:#111418; }
              .rule { stroke:#eceef1; }
              @media (prefers-color-scheme: dark) {
                .title { fill:#eef1f5; }
                .sub { fill:#8b939f; }
                .stat { fill:#8b939f; }
                .statv { fill:#eef1f5; }
                .chip { fill:#14171b; stroke:#262b33; }
                .chiptxt { fill:#eef1f5; }
                .rule { stroke:#1d2127; }
              }
            </style>
            <g transform="translate(0, 22)">
          __CHIPS__
            </g>
            <text class="title" x="0" y="66">__TITLE__</text>
            <text class="sub" x="0" y="94">__SUBTITLE__</text>
            <line class="rule" x1="0" y1="118" x2="860" y2="118"/>
            <text class="stat" x="0" y="140">
              <tspan class="statv">__GROUP_COUNT__</tspan> 组规则
              <tspan> · </tspan>
              <tspan class="statv">__TOTAL__</tspan> 条
            </text>
          </svg>
          """
          svg = svg.replace("__CHIPS__", chip(chips_x, 92, APPS[0]) + chip(chips_x + 100, 100, APPS[1]))
          svg = svg.replace("__TITLE__", TITLE).replace("__SUBTITLE__", SUBTITLE)
          svg = svg.replace("__GROUP_COUNT__", str(len(groups)))
          svg = svg.replace("__TOTAL__", f"{total_rules:,}")
          ASSET_DIR.mkdir(parents=True, exist_ok=True)
          BANNER.write_text(svg, encoding="utf-8", newline="\n")
          print("assets/header.svg 已生成")

          # ------------------------------------------------------------ README.md
          banner_url = RAW + "/assets/header.svg"
          md = []
          md.append("<!-- 本文件由 GitHub Actions 自动生成，请勿手动编辑 -->")
          md.append("")
          md.append('<div align="center">')
          md.append('<img src="' + banner_url + '" width="860" alt="' + TITLE + '">')
          md.append("</div>")
          md.append("")
          md.append("> 点击导入按钮会唤起对应 App 并弹出确认，确认后规则即加入 App。")
          md.append("")

          for title, items in buckets:
              md.append("### " + title + " <sub>" + str(len(items)) + " 组</sub>")
              md.append("")
              md.append("| 规则 | 导入 |")
              md.append("|:---|:---|")
              for item in items:
                  md.append("| **" + item["name"] + "** <sub>" + f"{item['count']:,}"
                            + "</sub> | " + buttons_md(item) + " |")
              md.append("")

          md.append("---")
          md.append("")
          md.append("## 使用说明")
          md.append("")
          md.append("1. 在手机上点开需要的规则组对应的导入按钮")
          md.append("2. 系统唤起 App 后确认导入")
          md.append("3. 规则会加入 App 的规则列表，本仓库每天自动同步")
          md.append("")
          md.append("<details>")
          md.append("<summary>点击没有反应？</summary>")
          md.append("")
          md.append("- 确认已经安装对应的 App")
          md.append("- 在系统浏览器中打开本页面，而不是 App 内置浏览器")
          md.append("- iOS 上如仍无反应，可长按链接选择「在 Safari 中打开」")
          md.append("")
          md.append("</details>")
          md.append("")
          md.append("---")
          md.append("")
          md.append("## 声明")
          md.append("")
          md.append("- 本仓库仅对公开规则做整理与分类，不生产、不修改规则内容。")
          md.append("- 规则均来自互联网公开项目，版权归原作者所有。")
          md.append("- 仅供个人学习与技术交流，请勿用于商业用途。")
          md.append("- 使用本规则可能影响网络访问，请自行评估风险并承担相应后果。")
          md.append("- 如有侵权，请联系删除。")
          md.append("")
          md.append("---")
          md.append("")
          md.append("## 感谢")
          md.append("")
          md.append("规则来自以下开源项目，感谢每一位作者：")
          md.append("")
          md.append("- [blackmatrix7/ios_rule_script](https://github.com/blackmatrix7/ios_rule_script) — 主力规则来源")
          md.append("- [Loyalsoldier/surge-rules](https://github.com/Loyalsoldier/surge-rules) — 国内外分流规则")
          md.append("- [Repcz/Tool](https://github.com/Repcz/Tool) — 补充与自定义规则")
          md.append("- [TG-Twilight/AWAvenue-Ads-Rule](https://github.com/TG-Twilight/AWAvenue-Ads-Rule) — 去广告规则")
          md.append("- [217heidai/adblockfilters](https://github.com/217heidai/adblockfilters) — 去广告规则")
          md.append("- [anti-AD](https://anti-ad.net/) — 去广告规则")
          md.append("")
          md.append("---")
          md.append("")
          md.append("<sub>由 GitHub Actions 自动生成</sub>")
          md.append("")

          Path("README.md").write_text("\n".join(md), encoding="utf-8", newline="\n")
          print("README.md 已生成")

          if not WITH_HTML:
              raise SystemExit(0)

          def button_html(app, url):
              image = ('<img src="' + html.escape(app["icon"]) + '" alt="">') if app["icon"] else ""
              return ('<a class="act" href="' + html.escape(url) + '">' + image
                      + "<span>" + app["name"] + "</span></a>")

          def buttons_html(item):
              out = []
              if item["loon_url"]:
                  out.append(button_html(APPS[0], loon_link(item["loon_url"])))
              if item["egern_url"]:
                  out.append(button_html(APPS[1], egern_link(item["egern_url"])))
              return "".join(out)

          sections_html = []
          for title, items in buckets:
              rows = []
              for item in items:
                  rows.append(
                      "<tr><td class=\"rule\"><span class=\"nm\">" + html.escape(item["name"])
                      + "</span><span class=\"ct\">" + f"{item['count']:,}" + "</span></td>"
                      + "<td class=\"go\">" + buttons_html(item) + "</td></tr>"
                  )
              sections_html.append(
                  "    <section>\n"
                  + "      <h2>" + html.escape(title) + " <span class=\"n\">" + str(len(items)) + " 组</span></h2>\n"
                  + "      <table><tbody>\n" + "\n".join(rows) + "\n      </tbody></table>\n"
                  + "    </section>"
              )

          template = """<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="color-scheme" content="light dark">
          <title>__TITLE__</title>
          <style>
            :root {
              color-scheme: light dark;
              --bg:#ffffff; --fg:#111418; --muted:#6b7280;
              --line:#eceef1; --line-strong:#dfe3e9;
              --soft:#f7f8fa; --soft-hover:#eef0f3; --accent:#0a84ff;
            }
            @media (prefers-color-scheme: dark) {
              :root {
                --bg:#0b0d10; --fg:#eef1f5; --muted:#8b939f;
                --line:#1d2127; --line-strong:#2a2f37;
                --soft:#14171b; --soft-hover:#1c2026; --accent:#4da3ff;
              }
            }
            * { box-sizing:border-box; }
            html { -webkit-text-size-adjust:100%; }
            body {
              margin:0; background:var(--bg); color:var(--fg);
              font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                          "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
              font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
            }
            .wrap { max-width:860px; margin:0 auto; padding:52px 24px 80px; }
            .banner { display:block; width:100%; max-width:860px; height:auto; margin:0 0 22px; }
            .lead { margin:0 0 8px; color:var(--muted); font-size:14px; }

            section { margin-top:44px; }
            h2 {
              display:flex; align-items:baseline; gap:9px;
              margin:0 0 6px; padding-bottom:12px; border-bottom:1px solid var(--line-strong);
              font-size:15px; font-weight:600;
            }
            h2 .n { font-size:12.5px; font-weight:400; color:var(--muted); }
            table { width:100%; border-collapse:collapse; }
            td { padding:13px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
            tr:last-child td { border-bottom:none; }
            td.rule .nm { font-size:15px; font-weight:500; }
            td.rule .ct {
              margin-left:10px; font-size:12.5px; color:var(--muted);
              font-variant-numeric:tabular-nums;
            }
            td.go { text-align:right; white-space:nowrap; }

            .act {
              display:inline-flex; align-items:center; gap:7px;
              padding:5px 13px 5px 7px; margin-left:8px;
              border:1px solid var(--line-strong); border-radius:999px;
              background:var(--soft); color:var(--fg); text-decoration:none;
              font-size:13px; font-weight:500; white-space:nowrap;
              transition:background .15s ease, border-color .15s ease;
            }
            .act:hover { background:var(--soft-hover); border-color:var(--muted); }
            .act img { width:18px; height:18px; border-radius:5px; display:block; }

            h3 {
              margin:56px 0 14px; padding-top:26px; border-top:1px solid var(--line);
              font-size:15px; font-weight:600;
            }
            ol, ul { margin:0; padding-left:20px; }
            li { margin:7px 0; }
            li::marker { color:var(--muted); }
            a { color:var(--accent); text-decoration:none; }
            a:hover { text-decoration:underline; }
            .links { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:2px 28px; }
            .links a { display:inline-block; padding:3px 0; font-size:14px; }
            .note { color:var(--muted); font-size:13px; margin:0 0 10px; }
            footer {
              margin-top:56px; padding-top:22px; border-top:1px solid var(--line);
              color:var(--muted); font-size:12px;
            }

            @media (max-width:640px) {
              .wrap { padding:28px 18px 56px; }
              .banner { margin-bottom:16px; }
              table, tbody, tr, td { display:block; width:100%; }
              tr { padding:15px 0; border-bottom:1px solid var(--line); }
              tr:last-child { border-bottom:none; }
              td { border:none; padding:0; }
              td.rule { display:flex; align-items:baseline; gap:9px; margin-bottom:11px; }
              td.rule .nm { font-size:16px; }
              td.go { text-align:left; }
              .act { margin:0 8px 0 0; padding:9px 17px 9px 10px; }
              .act img { width:19px; height:19px; }
              .links { grid-template-columns:1fr; }
              section { margin-top:34px; }
            }
          </style>
          </head>
          <body>
          <div class="wrap">
            <img class="banner" src="assets/header.svg" alt="__TITLE__">
            <p class="lead">点击导入按钮会唤起对应 App 并弹出确认，确认后规则即加入 App。</p>

          __SECTIONS__

            <h3>使用说明</h3>
            <ol>
              <li>点开需要的规则组对应的导入按钮</li>
              <li>系统唤起 App 后确认导入</li>
              <li>规则会加入 App 的规则列表，本仓库每天自动同步</li>
            </ol>

            <h3>声明</h3>
            <ul>
              <li>本仓库仅对公开规则做整理与分类，不生产、不修改规则内容。</li>
              <li>规则均来自互联网公开项目，版权归原作者所有。</li>
              <li>仅供个人学习与技术交流，请勿用于商业用途。</li>
              <li>使用本规则可能影响网络访问，请自行评估风险并承担相应后果。</li>
              <li>如有侵权，请联系删除。</li>
            </ul>

            <h3>感谢</h3>
            <p class="note">规则来自以下开源项目，感谢每一位作者。</p>
            <div class="links">
              <a href="https://github.com/blackmatrix7/ios_rule_script">blackmatrix7/ios_rule_script</a>
              <a href="https://github.com/Loyalsoldier/surge-rules">Loyalsoldier/surge-rules</a>
              <a href="https://github.com/Repcz/Tool">Repcz/Tool</a>
              <a href="https://github.com/TG-Twilight/AWAvenue-Ads-Rule">TG-Twilight/AWAvenue-Ads-Rule</a>
              <a href="https://github.com/217heidai/adblockfilters">217heidai/adblockfilters</a>
              <a href="https://anti-ad.net/">anti-AD</a>
            </div>

            <footer>由 GitHub Actions 自动生成</footer>
          </div>
          </body>
          </html>
          """

          Path("index.html").write_text(
              template.replace("__SECTIONS__", "\n".join(sections_html))
              .replace("__TITLE__", TITLE),
              encoding="utf-8", newline="\n",
          )
          print("index.html 已生成")
          PY

      - name: Commit and push
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -f index.html ]; then git add index.html; fi
          if [ -f assets/header.svg ]; then git add assets/header.svg; fi
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "docs: 更新规则导航"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "pushed"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "push failed after 5 attempts" >&2
          exit 1
