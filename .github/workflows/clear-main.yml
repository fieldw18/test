name: Build

on:
  workflow_dispatch:
    inputs:
      mirror_icons:
        description: "Mirror icon images into this repository (slow and increases repository size)"
        required: false
        default: false
        type: boolean
      allow_empty:
        description: "Create a commit even when generated files do not change"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */8 * * *"

permissions:
  contents: write

concurrency:
  group: build-generated-files
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download rules
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf raw
          mkdir -p raw
          groups=(
            "Telegram https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Telegram/Telegram.list"
            "Alibaba https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Alibaba/Alibaba_All_No_Resolve.list"
            "ByteDance https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/ByteDance/ByteDance.list"
            "Tencent https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Tencent/Tencent_All_No_Resolve.list"
            "YouTube https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/YouTube/YouTube.list"
            "Twitter https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Twitter/Twitter.list"
            "DouYin https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/DouYin/DouYin.list"
            "TikTok https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/TikTok/TikTok.list"
            "Github https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/GitHub/GitHub.list"
            "Google https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Google/Google.list"
            "Spotify https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Spotify/Spotify.list"
            "Netflix https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Netflix/Netflix.list"
            "ChinaIPs https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/ChinaIPs/ChinaIPs.list"
            "BanAD https://anti-ad.net/surge.txt https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockloon.list"
            "China https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/ChinaMax/ChinaMax_All_No_Resolve.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/China/China_All_No_Resolve.list"
            "Apple https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Apple/Apple_All_No_Resolve.list"
            "AppleCN https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/apple.txt https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/icloud.txt"
            "Meta https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Facebook/Facebook.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Instagram/Instagram.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Threads/Threads.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Whatsapp/Whatsapp.list"
            "HttpDns https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/BlockHttpDNS/BlockHttpDNS.list"
            "AI https://git.repcz.link/kelee.one/Tool/Loon/Lsr/AI.lsr"
            "Talkatone https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Surge/Rules/Talkatone.list"
            "Global https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/proxy.txt https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/gfw.txt https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Proxy/Proxy_All_No_Resolve.list"
            "Lan https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Custom/Lan.list"
            "GeoipCN https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Custom/FILTER_REGION.list"
            "SpeedtestChina https://git.repcz.link/kelee.one/Tool/Loon/Lsr/SpeedtestChina.lsr"
            "SpeedtestInternational https://git.repcz.link/kelee.one/Tool/Loon/Lsr/SpeedtestInternational.lsr"
            "PikPak https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/PikPak/PikPak.list"
          )
          for entry in "${groups[@]}"; do
            read -r name urls <<< "$entry"
            input="raw/$name.input"
            : > "$input"
            for url in $urls; do
              echo "Downloading $url"
              curl --fail --silent --show-error --location --retry 3 \
                --retry-all-errors --connect-timeout 15 --max-time 180 "$url" >> "$input"
              printf '\n' >> "$input"
            done
            awk 'BEGIN { OFS="" } { sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, ""); if ($0 != "" && $0 !~ /^#/) print }' "$input" \
              | awk '!seen[$0]++' > "raw/$name.clean"
            rm -f "$input"
            test -s "raw/$name.clean"
          done

      - name: Build Loon and Egern files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf Loon/Rules Egern/Rules
          mkdir -p Loon/Rules Egern/Rules
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          RULE_TYPES = (
              "DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-KEYWORD", "DOMAIN-REGEX",
              "DOMAIN-WILDCARD", "IP-CIDR", "IP-CIDR6", "GEOIP", "USER-AGENT",
              "URL-REGEX", "IP-ASN", "DEST-PORT", "PROTOCOL",
          )
          EG_TYPES = {
              "DOMAIN": "domain_set", "DOMAIN-SUFFIX": "domain_suffix_set",
              "DOMAIN-KEYWORD": "domain_keyword_set", "DOMAIN-REGEX": "domain_regex_set",
              "DOMAIN-WILDCARD": "domain_wildcard_set", "IP-CIDR": "ip_cidr_set",
              "IP-CIDR6": "ip_cidr6_set", "GEOIP": "geoip_set", "USER-AGENT": "user_agent_set",
              "URL-REGEX": "url_regex_set", "IP-ASN": "asn_set", "DEST-PORT": "dest_port_set",
              "PROTOCOL": "protocol_set",
          }
          IP_TYPES = {"IP-CIDR", "IP-CIDR6", "GEOIP", "IP-ASN"}
          logical_re = re.compile(r"^(AND|OR|NOT),", re.I)

          def split_rule(line):
              kind, separator, value = line.partition(",")
              kind = kind.strip().upper()
              if not separator or kind not in RULE_TYPES:
                  return None
              value = re.sub(r",\s*no-resolve\s*$", "", value.strip(), flags=re.I)
              return kind, value

          def read_rules(path, loon_no_resolve):
              loon_lines = []
              grouped = {kind: set() for kind in RULE_TYPES}
              logical = []
              for raw in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  had_no_resolve = bool(re.search(r",\s*no-resolve\s*$", line, re.I))
                  line = re.sub(r",\s*no-resolve\s*$", "", line, flags=re.I)
                  if logical_re.match(line):
                      logical.append(line)
                      loon_lines.append(line)
                      continue
                  parsed = split_rule(line)
                  if parsed is None:
                      if not re.match(r"^(PROCESS-NAME|SCRIPT),", line, re.I):
                          loon_lines.append(line)
                      continue
                  kind, value = parsed
                  grouped[kind].add(value)
                  suffix = ", no-resolve" if had_no_resolve or (loon_no_resolve and kind in IP_TYPES) else ""
                  loon_lines.append(f"{kind}, {value}{suffix}")
              return loon_lines, grouped, logical

          def quote_yaml(value):
              return json.dumps(value, ensure_ascii=False)

          raw_dir = Path("raw")
          for source in sorted(raw_dir.glob("*.clean")):
              name = source.stem
              loon_no_resolve = name not in {"GeoipCN", "Lan"}
              loon_lines, grouped, logical = read_rules(source, loon_no_resolve)
              if loon_lines:
                  Path("Loon/Rules", f"{name}.list").write_text(
                      f"# 规则名称: {name}\n# 规则统计: {len(loon_lines)}\n\n" +
                      "\n".join(loon_lines) + "\n", encoding="utf-8")
              entries = [(EG_TYPES[k], sorted(v)) for k, v in grouped.items() if v]
              if not entries:
                  continue
              lines = [f"# 规则名称: {name}", f"# 规则统计: {sum(len(v) for v in grouped.values())}", ""]
              if any(grouped[k] for k in IP_TYPES):
                  lines += ["# 仅影响 IP/ASN 规则，符合 Egern 官方规则集语义", "no_resolve: true", ""]
              if logical:
                  lines += [f"# 警告: 已跳过 {len(logical)} 条 AND/OR/NOT 逻辑规则；规则集文件无法无损表达 Loon 逻辑项", ""]
              for key, values in entries:
                  lines.append(f"{key}:")
                  lines.extend(f"  - {quote_yaml(value)}" for value in values)
                  lines.append("")
              Path("Egern/Rules", f"{name}.yaml").write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
              if logical:
                  print(f"::warning file={source}::{name}: skipped {len(logical)} logical rules in Egern output")
          print("Rule files built")
          PY

      - name: Build icon indexes
        shell: bash
        env:
          MIRROR_ICONS: ${{ inputs.mirror_icons || 'false' }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote, urlsplit
          import re

          image_re = re.compile(r"\.(?:png|jpe?g|gif|svg|webp)(?:\?.*)?$", re.I)
          sources = {
              "Icons-all": [
                  "https://raw.githubusercontent.com/Koolson/Qure/master/Other/QureColor-All.json",
                  "https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/ligeicon.json",
              ],
              "Emby": ["https://emby-icon.vercel.app/TFEL-Emby.json"],
          }
          mirror = os.environ.get("MIRROR_ICONS", "false").lower() == "true"
          repo = "${{ github.repository }}"
          branch = "${{ github.ref_name }}"

          def curl(url):
              return subprocess.check_output([
                  "curl", "--fail", "--silent", "--show-error", "--location",
                  "--retry", "3", "--connect-timeout", "15", url,
              ], stderr=subprocess.DEVNULL)

          def icon_filename(url):
              name = Path(urlsplit(url).path).name or "icon.png"
              return quote(name, safe="._-()[]%")

          for category, urls in sources.items():
              target = Path("Icons", category)
              target.mkdir(parents=True, exist_ok=True)
              icons = {}
              for source in urls:
                  try:
                      data = json.loads(curl(source))
                  except Exception as exc:
                      print(f"::warning::{source}: {exc}")
                      continue
                  if isinstance(data, dict):
                      data = data.get("icons", [])
                  if not isinstance(data, list):
                      continue
                  for original in data:
                      if not isinstance(original, dict):
                          continue
                      url = original.get("url")
                      if not isinstance(url, str) or not image_re.search(url):
                          continue
                      name = str(original.get("name") or icon_filename(url))
                      if name in icons:
                          continue
                      item = dict(original)
                      if mirror:
                          destination = target / icon_filename(url)
                          if not destination.exists():
                              try:
                                  destination.write_bytes(curl(url))
                              except Exception as exc:
                                  print(f"::warning::{url}: {exc}")
                                  continue
                          item["url"] = f"https://raw.githubusercontent.com/{repo}/{branch}/Icons/{category}/{destination.name}"
                      icons[name] = item
              output = {"name": category, "description": f"{len(icons)} 图标", "icons": list(icons.values())}
              Path("Icons").mkdir(exist_ok=True)
              Path("Icons", f"{category}.json").write_text(
                  json.dumps(output, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
              )
              print(f"Built {category}: {len(icons)} icons")
          PY

      - name: Validate generated files
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby - <<'RUBY'
          require "yaml"
          Dir["Egern/Rules/*.yaml"].each do |path|
            data = YAML.load_file(path)
            abort "invalid Egern rule set: #{path}" unless data.is_a?(Hash)
            allowed = data.keys.all? { |key| key.to_s == "no_resolve" || key.to_s.end_with?("_set") }
            abort "invalid Egern rule-set key: #{path}" unless allowed
          end
          abort "no Loon rule files" if Dir["Loon/Rules/*.list"].empty?
          abort "no Egern rule files" if Dir["Egern/Rules/*.yaml"].empty?
          puts "Egern and Loon files validated"
          RUBY
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path("Icons").glob("*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(data.get("icons"), list), path
              names = [item.get("name") for item in data["icons"]]
              assert len(names) == len(set(names)), path
          print("Icon indexes validated")
          PY

      - name: Commit and push
        shell: bash
        env:
          ALLOW_EMPTY: ${{ inputs.allow_empty || 'false' }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Loon/Rules Egern/Rules Icons
          if git diff --cached --quiet; then
            if [[ "$ALLOW_EMPTY" != "true" ]]; then
              echo "No generated changes"
              exit 0
            fi
            git commit --allow-empty -m "chore: refresh generated rules and icons"
          else
            git commit -m "chore: update generated rules and icons"
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "Push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "Unable to push after five attempts" >&2
          exit 1
