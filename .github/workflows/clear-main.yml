name: Build

on:
  workflow_dispatch:
    inputs:
      mirror_icons:
        description: 'Mirror icons into this repo (slow)'
        type: boolean
        default: false
  schedule:
    - cron: '0 */8 * * *'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  RULE_WORKERS: '8'
  ICON_WORKERS: '16'
  ICON_BRANCH: main
  MIRROR_ICONS: ${{ inputs.mirror_icons && '1' || '0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache mirrored icons
        if: env.MIRROR_ICONS == '1'
        uses: actions/cache@v4
        with:
          path: Icons
          key: icons-cache-v5-${{ github.run_id }}
          restore-keys: |
            icons-cache-v5-

      - name: Build rules
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import concurrent.futures as futures
          import datetime as dt
          import email.utils
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          TZ = dt.timezone(dt.timedelta(hours=8))
          SOURCES = {
              "Telegram": ["https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list"],
              "Alibaba": ["https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Alibaba/Alibaba_All_No_Resolve.list"],
              "ByteDance": ["https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ByteDance/ByteDance.list"],
              "Tencent": ["https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Tencent/Tencent_All_No_Resolve.list"],
              "YouTube": ["https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list"],
              "Twitter": ["https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitter/Twitter.list"],
              "DouYin": ["https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/DouYin/DouYin.list"],
