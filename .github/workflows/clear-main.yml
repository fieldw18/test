name: Build

on:
  workflow_dispatch:
    inputs:
      groups:
        description: '规则组名(逗号分隔),空=全部'
        default: ''
        type: string
      mirror_icons:
        description: '镜像图标到仓库(默认走 CDN)'
        default: false
        type: boolean
      allow_empty:
        description: '无变更时提交空 commit'
        default: true
        type: boolean
  schedule:
    - cron: '0 */8 * * *'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GROUPS_FILTER: ${{ inputs.groups || '' }}
      MIRROR_ICONS: ${{ inputs.mirror_icons || 'false' }}
      ALLOW_EMPTY: ${{ inputs.allow_empty || 'true' }}
      REPO: ${{ github.repository }}
      BRANCH: main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Icons
        if: ${{ inputs.mirror_icons == true }}
        uses: actions/cache@v4
        with:
          path: Icons
          key: icons-images-v5-${{ hashFiles('Icons/**/updated.flag') }}
          restore-keys: icons-images-v5-

      - name: Download Rules
        run: |
          set -e
          mkdir -p raw
          groups=(
            "Telegram https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Telegram/Telegram.list"
            "Alibaba https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Alibaba/Alibaba_All_No_Resolve.list"
            "ByteDance https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/ByteDance/ByteDance.list"
            "Tencent https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Tencent/Tencent_All_No_Resolve.list"
            "YouTube https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/YouTube/YouTube.list"
            "Twitter https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Twitter/Twitter.list"
            "DouYin https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/DouYin/DouYin.list"
            "TikTok https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/TikTok/TikTok.list"
            "Github https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/GitHub/GitHub.list"
            "Google https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Google/Google.list"
            "Spotify https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Spotify/Spotify.list"
            "Netflix https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Netflix/Netflix.list"
            "ChinaIPs https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/ChinaIPs/ChinaIPs.list"
            "BanAD https://anti-ad.net/surge.txt https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockloon.list"
            "China https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/ChinaMax/ChinaMax_All_No_Resolve.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/China/China_All_No_Resolve.list"
            "Apple https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Apple/Apple_All_No_Resolve.list"
            "AppleCN https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/apple.txt https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/icloud.txt"
            "Meta https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Facebook/Facebook.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Instagram/Instagram.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Threads/Threads.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Whatsapp/Whatsapp.list"
            "HttpDns https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/BlockHttpDNS/BlockHttpDNS.list"
            "AI https://git.repcz.link/kelee.one/Tool/Loon/Lsr/AI.lsr"
            "Talkatone https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Surge/Rules/Talkatone.list"
            "Global https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/proxy.txt https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/gfw.txt https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Proxy/Proxy_All_No_Resolve.list"
            "Lan https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Custom/Lan.list"
            "GeoipCN https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Custom/FILTER_REGION.list"
            "SpeedtestChina https://git.repcz.link/kelee.one/Tool/Loon/Lsr/SpeedtestChina.lsr"
            "SpeedtestInternational https://git.repcz.link/kelee.one/Tool/Loon/Lsr/SpeedtestInternational.lsr"
            "PikPak https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/PikPak/PikPak.list"
          )

          extract_time() {
            local f="$1" t=""
            t=$(grep -m1 -oE '# *UPDATED: *[0-9]{4}-[0-9]{2}-[0-9]{2}[ T]*[0-9]{2}:[0-9]{2}(:[0-9]{2})?' "$f" 2>/dev/null | sed 's/^# *UPDATED: *//')
            [ -n "$t" ] && { echo "$t"; return; }
            t=$(grep -m1 -oE '#!date=[0-9]{4}/[0-9]{2}/[0-9]{2}[ T]*[0-9]{2}:[0-9]{2}(:[0-9]{2})?' "$f" 2>/dev/null | sed 's/.*=//' | tr '/' '-')
            [ -n "$t" ] && { echo "$t"; return; }
            t=$(grep -m1 -oE '# *Update time: *[0-9]{4}-[0-9]{2}-[0-9]{2}[ T]*[0-9]{2}:[0-9]{2}(:[0-9]{2})?' "$f" 2>/dev/null | sed 's/^# *Update time: *//')
            [ -n "$t" ] && { echo "$t"; return; }
            t=$(grep -m1 -oE '#VER=[0-9]{14}' "$f" 2>/dev/null | sed 's/#VER=//' | sed -E 's/([0-9]{4})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})/\1-\2-\3 \4:\5:\6/')
            [ -n "$t" ] && { echo "$t"; return; }
            t=$(head -1 "$f" 2>/dev/null | grep -oE '^# [0-9]{4}-[0-9]{2}-[0-9]{2}[ T]*[0-9]{2}:[0-9]{2}(:[0-9]{2})?')
            [ -n "$t" ] && { echo "${t#\# }"; return; }
            echo "unknown"
          }

          should_skip() {
            [ -z "$GROUPS_FILTER" ] && return 1
            local IFS=','
            for g in $GROUPS_FILTER; do
              [ "$g" = "$1" ] && return 0
            done
            return 1
          }

          for line in "${groups[@]}"; do
            read -r name urls <<< "$line"
            should_skip "$name" && { echo "Skip: $name"; continue; }
            tmp="raw/$name.tmp"
            > "$tmp"
            for url in $urls; do
              if ! curl -sL --fail --retry 3 --max-time 30 --connect-timeout 10 "$url" >> "$tmp" 2>/dev/null; then
                echo "::warning::Failed to fetch $url for $name"
              fi
              echo "" >> "$tmp"
            done
            update_time=$(extract_time "$tmp")
            echo "$update_time" > "raw/$name.meta"
            sed -E 's/,[[:space:]]*no-resolve[[:space:]]*$//' "$tmp" | \
              grep -vE '^\s*(#|$)' | \
              sed -E 's/^([A-Z-]+),[[:space:]]*/\1,/' | \
              sort -u > "raw/$name.clean"
            rm -f "$tmp"
            echo "[$name] $(wc -l < "raw/$name.clean") rules, updated: $update_time"
          done

      - name: Build Loon Rules
        run: |
          mkdir -p Loon/Rules
          for f in raw/*.clean; do
            [ -s "$f" ] || continue
            name=$(basename "$f" .clean)
            update_time=$(cat "raw/$name.meta" 2>/dev/null || echo "unknown")
            if [[ "$name" == "GeoipCN" || "$name" == "Lan" ]]; then
              processed=$(cat "$f")
            else
              processed=$(sed -E '/^(IP-CIDR|IP-CIDR6|IP-ASN),/ s/$/,no-resolve/' "$f")
            fi
            count=$(printf '%s' "$processed" | grep -cE '^[A-Z-]+,' || echo 0)
            {
              echo "# 规则名称: $name"
              echo "# 规则统计: $count"
              echo "# 上游更新: $update_time"
              echo ""
              printf '%s\n' "$processed"
            } > "Loon/Rules/$name.list"
          done

      - name: Build Egern Rules
        run: |
          mkdir -p Egern/Rules
          RULE_MAP=(
            "DOMAIN:domain_set:0"
            "DOMAIN-SUFFIX:domain_suffix_set:0"
            "DOMAIN-KEYWORD:domain_keyword_set:0"
            "DOMAIN-REGEX:domain_regex_set:1"
            "DOMAIN-WILDCARD:domain_wildcard_set:0"
            "IP-CIDR:ip_cidr_set:0"
            "IP-CIDR6:ip_cidr6_set:0"
            "GEOIP:geoip_set:0"
            "USER-AGENT:user_agent_set:1"
            "URL-REGEX:url_regex_set:1"
            "IP-ASN:asn_set:1"
            "DEST-PORT:dest_port_set:1"
          )
          ORDERED_TYPES=(DOMAIN DOMAIN-SUFFIX DOMAIN-KEYWORD DOMAIN-REGEX DOMAIN-WILDCARD IP-CIDR IP-CIDR6 GEOIP USER-AGENT URL-REGEX IP-ASN DEST-PORT)
          UNSUPPORTED_RE='^(PROCESS-NAME|SCRIPT|AND|OR|NOT|PROTOCOL),'
          NO_RESOLVE_EXCLUDE=(GeoipCN Lan)

          is_excluded() {
            local name="$1"
            for ex in "${NO_RESOLVE_EXCLUDE[@]}"; do
              [ "$name" = "$ex" ] && return 0
            done
            return 1
          }

          for f in raw/*.clean; do
            [ -s "$f" ] || continue
            name=$(basename "$f" .clean)
            update_time=$(cat "raw/$name.meta" 2>/dev/null || echo "unknown")

            declare -A BY_TYPE
            unsupported=0
            total=0

            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if [[ "$line" =~ $UNSUPPORTED_RE ]]; then
                unsupported=$((unsupported + 1))
                continue
              fi
              rtype="${line%%,*}"
              val="${line#*,}"
              val=$(echo "$val" | sed -E 's/,[[:space:]]*no-resolve[[:space:]]*$//' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
              found=0
              for mapping in "${RULE_MAP[@]}"; do
                key="${mapping%%:*}"
                if [ "$rtype" = "$key" ]; then
                  BY_TYPE["$key"]+="$val"$'\n'
                  total=$((total + 1))
                  found=1
                  break
                fi
              done
              [ "$found" -eq 0 ] && unsupported=$((unsupported + 1))
            done < "$f"

            [ "$total" -eq 0 ] && continue

            has_ip=0
            for t in IP-CIDR IP-CIDR6 IP-ASN; do
              [ -n "${BY_TYPE[$t]}" ] && has_ip=1 && break
            done

            {
              echo "# 规则名称: $name"
              echo "# 规则统计: $total"
              echo "# 上游更新: $update_time"
              [ "$unsupported" -gt 0 ] && echo "# Egern 不支持规则数: $unsupported"
              echo ""
              if [ "$has_ip" -eq 1 ] && ! is_excluded "$name"; then
                echo "no_resolve: true"
                echo ""
              fi
              for rtype in "${ORDERED_TYPES[@]}"; do
                [ -z "${BY_TYPE[$rtype]}" ] && continue
                mapping=""
                for m in "${RULE_MAP[@]}"; do
                  [ "${m%%:*}" = "$rtype" ] && mapping="$m" && break
                done
                ykey="${mapping#*:}"
                ykey="${ykey%%:*}"
                need_quote="${mapping##*:}"
                echo "$ykey:"
                echo "${BY_TYPE[$rtype]}" | sed '/^$/d' | sort -u | while IFS= read -r val; do
                  [ -z "$val" ] && continue
                  if [ "$need_quote" = "1" ]; then
                    escaped="${val//\'/\'\'}"
                    printf "  - '%s'\n" "$escaped"
                  else
                    printf "  - %s\n" "$val"
                  fi
                done
                echo ""
              done
            } > "Egern/Rules/$name.yaml"
            echo "[$name] $total rules, $unsupported unsupported"
            unset BY_TYPE
          done

      - name: Build Icons
        run: |
          mkdir -p Icons
          SOURCES=(
            "Flags https://raw.githubusercontent.com/Koolson/Qure/master/Other/QureColor-Area.json"
            "Media https://raw.githubusercontent.com/Koolson/Qure/master/Other/QureColor-Media.json"
            "Apps https://raw.githubusercontent.com/Koolson/Qure/master/Other/QureColor-AppGame.json"
            "Services https://raw.githubusercontent.com/Koolson/Qure/master/Other/QureColor-Service.json"
            "Server https://raw.githubusercontent.com/Koolson/Qure/master/Other/QureColor-Server.json"
            "Common https://raw.githubusercontent.com/Koolson/Qure/master/Other/QureColor-Common.json"
            "Inhibition https://raw.githubusercontent.com/Koolson/Qure/master/Other/QureColor-Inhibition.json"
            "Other https://raw.githubusercontent.com/Koolson/Qure/master/Other/QureColor-Other.json"
            "Emby https://emby-icon.vercel.app/TFEL-Emby.json"
          )

          for line in "${SOURCES[@]}"; do
            read -r category url <<< "$line"
            echo "Fetching $category..."
            curl -sL --fail --max-time 30 "$url" -o /tmp/icon_src.json || { echo "Failed: $category"; continue; }

            jq -r 'if type == "object" and has("icons") then .icons else if type == "array" then . else [] end end' /tmp/icon_src.json > /tmp/icon_list.json

            if [ "$MIRROR_ICONS" = "true" ]; then
              mkdir -p "Icons/$category"
              touch "Icons/$category/updated.flag"
              jq -r '.[].url // empty' /tmp/icon_list.json | while IFS= read -r icon_url; do
                [ -z "$icon_url" ] && continue
                filename=$(basename "$icon_url")
                target="Icons/$category/$filename"
                if [ ! -f "$target" ]; then
                  curl -sL --fail --max-time 60 --retry 3 "$icon_url" -o "$target" || true
                fi
                jq --arg repo "$REPO" --arg branch "$BRANCH" --arg cat "$category" --arg file "$filename" '
                  if .url == '"$icon_url"' then
                    .url = "https://raw.githubusercontent.com/\($repo)/\($branch)/Icons/\($cat)/" + (\($file) | gsub("/[^\w.-]/"; "%E") | gsub("%([0-9A-Fa-f]{2})"; "\(explode|map(if . > 127 then ord - 128 else ord end)|map(if . >= 10 then . else 48 + . end)|map(if . >= 65 then . else 97 + . - 32 end)|map(. | if . == 32 then 37 else . end)|join(""))))
                  else .
                  end
                ' /tmp/icon_list.json > /tmp/icon_tmp.json && mv /tmp/icon_tmp.json /tmp/icon_list.json
              done
            else
              jq --arg repo "$REPO" --arg branch "$BRANCH" --arg cat "$category" '
                map(
                  if .url? and (.url | startswith("https://raw.githubusercontent.com/")) then
                    .url = (.url | sub("https://raw.githubusercontent.com/"; "https://cdn.jsdelivr.net/gh/") | sub("/refs/heads/master/"; "@master/") | sub("/refs/heads/main/"; "@main/") | sub("/master/"; "@master/") | sub("/main/"; "@main/"))
                  else .
                  end
                )
              ' /tmp/icon_list.json > /tmp/icon_list2.json && mv /tmp/icon_list2.json /tmp/icon_list.json
            fi

            jq -s --arg category "$category" '
              {
                name: $category,
                description: (.[0] | length | tostring + " 图标"),
                icons: .[0]
              }
            ' /tmp/icon_list.json > "Icons/$category.json"
            jq . "Icons/$category.json" > /tmp/tmp.json && mv /tmp/tmp.json "Icons/$category.json"
            echo "  → Icons/$category.json ($(jq '.icons | length' "Icons/$category.json") icons)"
          done
          rm -f /tmp/icon_src.json /tmp/icon_list.json /tmp/icon_list2.json /tmp/tmp.json /tmp/icon_tmp.json

      - name: Validate YAML
        run: |
          python3 -c "
          import yaml, glob, sys
          bad = []
          for f in glob.glob('Egern/Rules/*.yaml'):
              try:
                  yaml.safe_load(open(f))
                  for line in open(f):
                      if line.startswith('  -  '):
                          bad.append(f'{f}: leading space')
                          break
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('YAML validation failed:')
              for b in bad:
                  print(' ', b)
              sys.exit(1)
          print(f'YAML OK ({len(glob.glob(\"Egern/Rules/*.yaml\"))} files)')
          "

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Loon/Rules/ 2>/dev/null || true
          git add -A Egern/Rules/ 2>/dev/null || true
          git add -A Icons/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes detected"
            if [ "$ALLOW_EMPTY" = "true" ]; then
              git commit --allow-empty -q -m "No changes at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            else
              exit 0
            fi
          else
            git commit -q -m "Auto update rules and icons"
          fi
          for i in 1 2 3 4 5; do
            if git push -q; then
              echo "Push OK"
              exit 0
            fi
            echo "Push failed (attempt $i), rebasing..."
            git pull --rebase origin "$BRANCH" || exit 1
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
